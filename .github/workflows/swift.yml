name: Swift
on: [push]
jobs:

  macos:
    name: macOS
    runs-on: macos-26
    strategy:
      matrix:
        config: ["debug"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build
      run: swift build -c ${{ matrix.config }} --target JunkbotCore
    - name: Build Tests
      run: swift build -c ${{ matrix.config }} --product JunkbotPackageTests
    - name: Test
      run: swift test -c ${{ matrix.config }} --skip-build

  linux:
    name: Linux (${{ matrix.container }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["swift:latest", "swiftlang/swift:nightly-noble"]
        config: ["debug"]
    container: ${{ matrix.container }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build
      run: swift build -c ${{ matrix.config }} --target JunkbotCore
    - name: Build Tests
      run: swift build -c ${{ matrix.config }} --product JunkbotPackageTests
    - name: Test
      run: swift test -c ${{ matrix.config }} --skip-build
  
  android:
    name: Android (build + upload APK)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Swift 6.3.3 via swiftly
        # The Android SDK artifact bundle below is only published for 6.3.3, not every patch
        # release (6.3.2, the version bundled with this runner's Xcode, has no Android SDK bundle
        # at all - confirmed 404) - the host compiler used to cross-compile must match the SDK
        # bundle's version exactly, since Swift's module format isn't cross-patch-compatible
        # (verified on-CI: "module compiled with Swift 6.3.3 cannot be imported by the Swift 6.3.2
        # compiler"). Installing 6.3.3 via swiftly instead of relying on Xcode's bundled toolchain
        # sidesteps that entirely.
        run: |
          set -eux
          curl -fsSL -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --quiet-shell-followup --assume-yes
          echo "SWIFTLY_HOME_DIR=$HOME/.swiftly" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$HOME/.swiftly/bin" >> "$GITHUB_ENV"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          "$HOME/.swiftly/bin/swiftly" install 6.3.3
          "$HOME/.swiftly/bin/swiftly" use 6.3.3
      - name: Swift Version
        run: swift --version
      - name: Install Swift Android SDK
        run: |
          set -eux
          url="https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz"
          curl -fsSL "$url" -o android.artifactbundle.tar.gz
          swift sdk install android.artifactbundle.tar.gz \
            --checksum d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
          swift sdk list
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK components (NDK, platform, build-tools)
        run: |
          set -eux
          android_home="$HOME/Library/Android/sdk"
          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          # The macOS runner doesn't have `sdkmanager` on PATH by default - install the
          # command-line-tools-only distribution ourselves into the standard
          # cmdline-tools/latest layout sdkmanager/AGP both expect.
          mkdir -p "$android_home/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-mac-14742923_latest.zip" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$android_home/cmdline-tools"
          mv "$android_home/cmdline-tools/cmdline-tools" "$android_home/cmdline-tools/latest"
          echo "$android_home/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$android_home/platform-tools" >> "$GITHUB_PATH"
          export PATH="$android_home/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "platform-tools"
      - name: Vendor SDL3 Android prebuilts
        run: ports/Android/scripts/fetch-sdl.sh
      - name: Ensure Gradle is available
        run: command -v gradle || brew install gradle
      - name: Build debug APK
        run: make -C ports/Android apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: junkbot-android-debug
          path: ports/Android/AndroidApp/app/build/outputs/apk/debug/app-debug.apk

  linux-sdl2:
    name: Linux (SDL2 port)
    runs-on: ubuntu-latest
    container: swift:6.3.2
    strategy:
      matrix:
        config: ["debug"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Install SDL2 dependencies
      run: apt-get update -y && apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev pkg-config
    - name: Build
      run: swift build --package-path ports/SDL2 -c ${{ matrix.config }} --product JunkbotSDL2

  macos-sdl2:
    name: macOS (SDL2 port)
    runs-on: macos-26
    strategy:
      matrix:
        config: ["debug"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Install SDL2 dependencies
      run: brew install sdl2 sdl2_image sdl2_mixer
    - name: Build
      run: swift build --package-path ports/SDL2 -c ${{ matrix.config }} --product JunkbotSDL2

  macos-sdl3:
    name: macOS (SDL3 port)
    runs-on: macos-26
    strategy:
      matrix:
        config: ["debug"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Install SDL3 dependencies
      run: brew install sdl3 sdl3_image sdl3_mixer
    - name: Build
      run: swift build --package-path ports/SDL3 -c ${{ matrix.config }} --product JunkbotSDL3

  darwin-macos:
    name: macOS (Xcode)
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Xcode Version
      run: xcodebuild -version
    - name: Build Junkbot-macOS
      run: |
        xcodebuild -project ports/Darwin/Junkbot.xcodeproj -scheme Junkbot-macOS \
          -configuration Debug -skipPackagePluginValidation build

  darwin-tvos:
    name: tvOS (Xcode)
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Xcode Version
      run: xcodebuild -version
    - name: Download tvOS platform
      run: xcodebuild -downloadPlatform tvOS
    - name: Build Junkbot-tvOS
      run: |
        xcodebuild -project ports/Darwin/Junkbot.xcodeproj -scheme Junkbot-tvOS \
          -configuration Debug -destination "generic/platform=tvOS Simulator" \
          -skipPackagePluginValidation build

  darwin-ios:
    name: iOS (Swift Playground)
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Xcode Version
      run: xcodebuild -version
    - name: Build JunkbotMobile
      # No `-project`: this is a `.swiftpm` App Playground, not an Xcode project/workspace -
      # `xcodebuild` auto-detects it from the current directory, the same way it auto-detects a
      # plain `Package.swift`. Confirmed working this way (previously undocumented/unverified -
      # `ports/Darwin/README.md` used to claim this couldn't be driven from the command line at
      # all, based only on `-project <bundle>.swiftpm` not working, which is a different thing).
      run: |
        cd ports/Darwin/JunkbotMobile.swiftpm
        xcodebuild build -scheme JunkbotMobile -destination "generic/platform=iOS Simulator" \
          -skipPackagePluginValidation
