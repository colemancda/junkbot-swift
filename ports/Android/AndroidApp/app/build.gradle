plugins {
    id 'com.android.application'
}

// app/ -> AndroidApp/ -> Android/ -> ports/ -> repo root
def repoRoot = rootDir.parentFile.parentFile.parentFile
def stagedAssetsDir = layout.buildDirectory.dir('stagedAssets').get().asFile
// `Models3D` is the same baked-entity-model directory (`.json`, used by `Vulkan3DManager.swift`/
// `Metal3DModel.swift`; the `.scn` siblings are Darwin/SceneKit-only, harmless to also ship) the
// macOS Metal renderer already consumes - see `tools/Junkbot3D/Sources/Junkbot3D/main.swift`'s
// `--bake-all`, which also writes `Models3D/junkbot_decal.png` for both renderers' chest emblem.
def gameAssetDirs = ['images', 'font', 'levels', 'audio', 'Models3D']

android {
    namespace 'org.junkbot.game'
    compileSdk 36

    defaultConfig {
        applicationId 'org.junkbot.game'
        // Matches the Swift build's android28 triple (ports/Android/Makefile API_LEVEL).
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.0.1'
    }

    sourceSets {
        main {
            // Populated by `make jnilibs` (game .so + SDL prebuilts + Swift runtime).
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Populated by the stageGameAssets/writeAssetManifest tasks below.
            assets.srcDirs += stagedAssetsDir
        }
    }
}

dependencies {
    // SDL's Java glue (SDLActivity & friends), extracted from the official SDL3 Android .aar by
    // ports/Android/scripts/fetch-sdl.sh.
    implementation files('../../Vendor/java/SDL3-android.jar')
}

// Bundle the repo's game data into the APK under assets/gameassets/**, plus a
// "path<TAB>bytes" manifest - Android's NDK AAssetDir API can't enumerate subdirectories, so
// the Swift side (ports/Android/Sources/JunkbotAndroid/AndroidMain.swift) reads this manifest
// to know what to extract to internal storage on first launch.
tasks.register('stageGameAssets', Copy) {
    into new File(stagedAssetsDir, 'gameassets')
    gameAssetDirs.each { dir ->
        from(new File(repoRoot, dir)) { into dir }
    }
    // Precompiled SPIR-V (`ports/Android/Shaders/*.spv`, committed output of `glslc` run against
    // the `.vert`/`.frag` sources in that same directory - see `Vulkan3DManager.swift`'s doc
    // comment) - lives under `ports/Android/`, not repo root like the other asset dirs above, so
    // it needs its own `from`/`into` pair rather than fitting `gameAssetDirs`'s pattern.
    from(new File(rootDir.parentFile, 'Shaders')) { into 'Shaders' }
}

tasks.register('writeAssetManifest') {
    dependsOn 'stageGameAssets'
    def baseDir = new File(stagedAssetsDir, 'gameassets')
    def manifestFile = new File(stagedAssetsDir, 'gameassets.manifest')
    outputs.file manifestFile
    doLast {
        def lines = new StringBuilder()
        baseDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            lines.append(baseDir.toPath().relativize(f.toPath()))
                .append('\t').append(f.length()).append('\n')
        }
        manifestFile.text = lines.toString()
    }
}

preBuild.dependsOn 'writeAssetManifest'
